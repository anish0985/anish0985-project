<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="minigpt-backend" content="" />
    <title>Sign in · MiniGPT</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
        <div class="auth-logo">
          <div class="logo-icon"><i class="fa-solid fa-robot"></i></div>
          <h1>MiniGPT</h1>
          <p class="auth-tagline">Secure sign-in for your AI workspace</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email"><i class="fa-solid fa-envelope"></i> Email</label>
            <input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
            <div class="password-wrapper">
              <input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
          <div class="auth-links">
            <button type="button" class="link-btn" id="forgot-password-btn">Forgot password?</button>
            <a href="register.html">Create account</a>
          </div>
          <p class="form-error" id="login-error"></p>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
