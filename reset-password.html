<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="minigpt-backend" content="" />
    <title>New password · MiniGPT</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a>
        <div class="auth-logo">
          <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
          <h1>Choose a new password</h1>
          <p class="auth-tagline">Use a strong password to keep your account secure</p>
        </div>

        <form id="reset-password-form" novalidate>
          <div class="form-group">
            <label for="reset-password"><i class="fa-solid fa-lock"></i> New password</label>
            <div class="password-wrapper">
              <input id="reset-password" name="password" type="password" placeholder="At least 6 characters" required />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label for="reset-confirm"><i class="fa-solid fa-lock"></i> Confirm password</label>
            <div class="password-wrapper">
              <input id="reset-confirm" name="confirm" type="password" placeholder="Confirm your password" required />
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save new password</button>
          <p class="form-error" id="reset-error"></p>
        </form>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
