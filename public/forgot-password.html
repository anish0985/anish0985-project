<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password · MiniGPT</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="back-link" href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a>
        <div class="auth-logo">
          <div class="logo-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
          <h1>Reset password</h1>
          <p class="auth-tagline">Enter your email and we’ll prepare a secure reset link</p>
        </div>

        <form id="forgot-password-form" novalidate>
          <div class="form-group">
            <label for="forgot-email"><i class="fa-solid fa-envelope"></i> Email</label>
            <input id="forgot-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="forgot-password-btn">Send reset link</button>
          <p class="auth-footer"><a href="login.html">Return to sign in</a></p>
          <p class="form-error" id="forgot-error"></p>
        </form>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
